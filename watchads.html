  <!-- =============================================
       GOOGLE IMA SDK — VAST VIDEO PLAYER LOGIC
       ============================================= -->
  <script>
  // ClickAdilla VAST tag
  const VAST_TAG_URL = 'https://vast.yomeno.xyz/vast?spot_id=1494956';

  let adsManager;
  let adsLoader;
  let adDisplayContainer;
  let adStarted = false;
  let adCompleted = false;

  // IMA initialize karo
  function initIMA() {
    const videoElement = document.getElementById('contentVideo');
    const adContainerEl = document.getElementById('adContainer');

    // AdDisplayContainer banao
    adDisplayContainer = new google.ima.AdDisplayContainer(adContainerEl, videoElement);

    // AdsLoader banao
    adsLoader = new google.ima.AdsLoader(adDisplayContainer);

    // Events
    adsLoader.addEventListener(
      google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
      onAdsManagerLoaded, false
    );
    adsLoader.addEventListener(
      google.ima.AdErrorEvent.Type.AD_ERROR,
      onAdError, false
    );

    // Video ended event
    videoElement.addEventListener('ended', function() {
      adsLoader.contentComplete();
    });
  }

  // User ne button click kiya — ad start karo
  function startVideoAd() {
    if (adStarted) return;
    adStarted = true;

    // Overlay hide karo
    document.getElementById('videoOverlay').style.display = 'none';

    // IMA initialize
    initIMA();

    // AdDisplayContainer initialize (user gesture ke andar zaruri)
    adDisplayContainer.initialize();

    // Ad request banao
    const adsRequest = new google.ima.AdsRequest();
    adsRequest.adTagUrl = VAST_TAG_URL;

    // Player size
    const wrap = document.getElementById('videoPlayerWrap');
    adsRequest.linearAdSlotWidth  = wrap.offsetWidth  || 480;
    adsRequest.linearAdSlotHeight = wrap.offsetHeight || 220;
    adsRequest.nonLinearAdSlotWidth  = wrap.offsetWidth  || 480;
    adsRequest.nonLinearAdSlotHeight = 90;

    adsLoader.requestAds(adsRequest);

    // Status update
    document.getElementById('statusBox').textContent = '📺 Video ad load ho rahi hai...';
  }

  function onAdsManagerLoaded(adsManagerLoadedEvent) {
    const videoElement = document.getElementById('contentVideo');

    // AdsManager settings
    const adsRenderingSettings = new google.ima.AdsRenderingSettings();
    adsRenderingSettings.restoreCustomPlaybackStateOnAdBreakComplete = true;

    adsManager = adsManagerLoadedEvent.getAdsManager(videoElement, adsRenderingSettings);

    // Ad events
    adsManager.addEventListener(google.ima.AdEvent.Type.STARTED,        onAdStarted);
    adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE,       onAdComplete);
    adsManager.addEventListener(google.ima.AdEvent.Type.SKIPPED,        onAdSkipped);
    adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, onAllAdsCompleted);
    adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,  onAdError);

    try {
      const wrap = document.getElementById('videoPlayerWrap');
      adsManager.init(wrap.offsetWidth || 480, wrap.offsetHeight || 220, google.ima.ViewMode.NORMAL);
      adsManager.start();
      document.getElementById('statusBox').textContent = '✅ Video ad chal rahi hai — dekhte raho!';
    } catch(e) {
      console.error('IMA start error:', e);
      onAdError();
    }
  }

  function onAdStarted(e) {
    console.log('Ad started');
    document.getElementById('statusBox').textContent = '▶ Video ad chal rahi hai — coins aa rahe hain!';
  }

  function onAdComplete(e) {
    console.log('Ad complete');
    adCompleted = true;
    // Coins dene ka kaam timer se hoga — yahan sirf "next ad" button dikhao
    document.getElementById('nextAdBtn').style.display = 'block';
    document.getElementById('statusBox').textContent = '✅ Ad khatam! Agli ad ke liye button dabao.';
  }

  function onAdSkipped(e) {
    console.log('Ad skipped');
    document.getElementById('nextAdBtn').style.display = 'block';
    document.getElementById('statusBox').textContent = '⏭ Ad skip ki — agli ad dekho!';
  }

  function onAllAdsCompleted(e) {
    console.log('All ads complete');
    document.getElementById('nextAdBtn').style.display = 'block';
  }

  function onAdError(e) {
    console.error('Ad error:', e && e.getError ? e.getError() : e);
    if (adsManager) adsManager.destroy();

    // Error pe overlay wapas dikhao with retry
    const overlay = document.getElementById('videoOverlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div style="font-size:40px">📺</div>
      <div style="font-size:12px;color:#8BA0C0">Ad load nahi hui — dobara try karo</div>
      <button class="play-btn" onclick="retryAd()">🔄 Retry</button>
    `;
    document.getElementById('statusBox').textContent = '⚠️ Ad error — retry karo ya page refresh karo';
  }

  function retryAd() {
    adStarted = false;
    adCompleted = false;
    // Overlay reset
    document.getElementById('videoOverlay').innerHTML = `
      <div class="video-overlay-icon">📺</div>
      <div class="video-overlay-text">Video ad ready hai!</div>
      <button class="play-btn" onclick="startVideoAd()">▶ Ad Chalao — Coins Kamao</button>
    `;
    document.getElementById('videoOverlay').style.display = 'flex';
    document.getElementById('nextAdBtn').style.display = 'none';
  }

  // Next ad load karo
  function loadNextAd() {
    document.getElementById('nextAdBtn').style.display = 'none';
    adStarted = false;
    adCompleted = false;
    if (adsManager) { adsManager.destroy(); adsManager = null; }

    // Overlay wapas dikhao
    document.getElementById('videoOverlay').style.display = 'flex';
    document.getElementById('videoOverlay').innerHTML = `
      <div class="video-overlay-icon">📺</div>
      <div class="video-overlay-text">Agli ad ready hai!</div>
      <button class="play-btn" onclick="startVideoAd()">▶ Ad Chalao — Coins Kamao</button>
    `;
    document.getElementById('statusBox').textContent = '📺 Agli ad ke liye button dabao!';
  }
  </script>

  <!-- FIREBASE + COINS LOGIC -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, get, set }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    import { getAuth, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCZnYb6pb5JXWpTFy15XRaAyEixZdVXclA",
      authDomain: "this-is-my-first-app-99e55.firebaseapp.com",
      databaseURL: "https://this-is-my-first-app-99e55-default-rtdb.firebaseio.com",
      projectId: "this-is-my-first-app-99e55"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);

    const COINS_PER_CYCLE = 2;
    const CYCLE_SECS = 30;

    let coins = 0;
    let adsWatched = 0;
    let totalMinutes = 0;
    let remaining = CYCLE_SECS;
    let currentUser = null;

    const coinsEl    = document.getElementById('coinsDisplay');
    const timerEl    = document.getElementById('timerDisplay');
    const progressEl = document.getElementById('progressBar');
    const adsEl      = document.getElementById('adsWatched');
    const totalEl    = document.getElementById('totalCoins');
    const timeEl     = document.getElementById('timeWatched');

    onAuthStateChanged(auth, (user) => {
      if(user){
        currentUser = user;
        document.getElementById('statusBox').textContent =
          '✅ ' + (user.displayName || user.email) + ' — Ads dekho coins kamao!';
      } else {
        document.getElementById('statusBox').textContent =
          '⚠️ Login karo coins save karne ke liye!';
      }
    });

    async function saveCoins(n){
      if(!currentUser) return;
      try {
        const r = ref(db, 'users/'+currentUser.uid+'/coins');
        const s = await get(r);
        await set(r, (s.val()||0) + n);
        const hr = ref(db, 'users/'+currentUser.uid+'/watchHistory');
        const hs = await get(hr);
        await set(hr, (hs.val()||0) + 1);
      } catch(e) {
        console.error('Firebase save error:', e);
      }
    }

    // Har 30 second mein coins dena (page pe ads hain — timer based earning)
    setInterval(()=>{
      remaining--;
      timerEl.textContent = remaining;
      progressEl.style.width = ((CYCLE_SECS-remaining)/CYCLE_SECS*100)+'%';
      if(remaining <= 0){
        remaining = CYCLE_SECS;
        progressEl.style.width = '0%';
        coins += COINS_PER_CYCLE;
        adsWatched++;
        coinsEl.textContent = coins;
        adsEl.textContent   = adsWatched;
        totalEl.textContent = coins;
        showCoinPop();
        saveCoins(COINS_PER_CYCLE);
        if(window.CoinChannel) window.CoinChannel.postMessage(COINS_PER_CYCLE.toString());
      }
    }, 1000);

    setInterval(()=>{ totalMinutes++; timeEl.textContent = totalMinutes; }, 60000);

    function showCoinPop(){
      const el = document.createElement('div');
      el.className = 'coin-pop';
      el.textContent = '+'+COINS_PER_CYCLE+' \uD83D\uDCB0';
      el.style.left = (Math.random()*60+20)+'%';
      el.style.top  = '50%';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1200);
    }
  </script>
