<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AdsEarn - Loading your link...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ad-top {
      width: 100%;
      max-width: 728px;
      min-height: 60px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 480px;
      margin: 16px 16px 80px 16px;
      background: #1a1a2e;
      border-radius: 20px;
      border: 1px solid #2a2a4a;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .card-header {
      background: linear-gradient(135deg, #6c47ff, #a855f7);
      padding: 20px;
      text-align: center;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .logo span { color: #ffd700; }
    .subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .ad-middle {
      background: #12122a;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #2a2a4a;
      border-bottom: 1px solid #2a2a4a;
    }
    .loading-state { padding: 30px 24px; text-align: center; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2a2a4a;
      border-top-color: #6c47ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { padding: 30px 24px; text-align: center; display: none; }
    .error-icon { font-size: 40px; margin-bottom: 10px; }
    .error-text { color: #ff6b6b; font-size: 14px; }
    .link-info { padding: 16px 20px 0; }
    .link-label {
      font-size: 10px; color: #888;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    }
    .link-url {
      background: #0f0f1a; border: 1px solid #2a2a4a;
      border-radius: 10px; padding: 10px 14px;
      font-size: 12px; color: #a0a0c0;
      word-break: break-all; max-height: 55px; overflow: hidden;
    }
    .countdown-area { padding: 20px; text-align: center; }
    .wait-text { font-size: 12px; color: #888; margin-bottom: 10px; }
    .progress-wrap {
      background: #0f0f1a; border-radius: 999px;
      height: 8px; width: 100%; margin-bottom: 16px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #6c47ff, #a855f7);
      border-radius: 999px;
    }
    .btn-ghost {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 2px solid #2a2a4a; background: #12122a;
      color: #444; font-size: 15px; font-weight: 600; cursor: not-allowed;
    }
    .btn-ghost .countdown-inside {
      font-size: 30px; font-weight: 800; color: #6c47ff;
      display: block; line-height: 1; margin-bottom: 2px;
    }
    .btn-active {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #6c47ff, #a855f7);
      color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; display: none;
      box-shadow: 0 4px 20px rgba(108,71,255,0.5);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 4px 20px rgba(108,71,255,0.5); }
      50%      { box-shadow: 0 4px 30px rgba(168,85,247,0.8); }
    }
    .coins-badge {
      margin: 10px 20px 0; padding: 8px 14px;
      background: rgba(0,200,100,0.1);
      border: 1px solid rgba(0,200,100,0.25);
      border-radius: 20px; font-size: 12px; color: #4ade80; text-align: center;
    }
    .footer-note {
      padding: 12px 20px 20px; text-align: center;
      font-size: 10px; color: #555; line-height: 1.7;
    }
    .ad-socialbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      min-height: 55px; background: #0a0a18;
      border-top: 1px solid #2a2a4a;
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    @media (max-width: 500px) { .card { margin: 10px 10px 80px 10px; } }
  </style>
</head>
<body>

  <!-- TOP BANNER AD -->
  <div class="ad-top">
    <script>
      atOptions = {
        'key' : '054b7c1a4cbb13266b09c565eb61513e',
        'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/054b7c1a4cbb13266b09c565eb61513e/invoke.js"></script>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="logo">Ads<span>Earn</span></div>
      <div class="subtitle">⚡ Earn coins by sharing links</div>
    </div>

    <!-- MIDDLE AD -->
    <div class="ad-middle">
      <script>
        atOptions = {
          'key' : '054b7c1a4cbb13266b09c565eb61513e',
          'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/054b7c1a4cbb13266b09c565eb61513e/invoke.js"></script>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <div style="color:#888; font-size:13px;">Link load ho raha hai...</div>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState">
      <div class="error-icon">❌</div>
      <div class="error-text">Link nahi mila ya expire ho gaya</div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      <div class="link-info">
        <div class="link-label">🔗 Your destination link</div>
        <div class="link-url" id="destUrl">Loading...</div>
      </div>

      <div class="coins-badge" id="coinsBadge">🪙 +2 coins link owner ko milenge is click se!</div>

      <div class="countdown-area">
        <div class="wait-text">Please wait while ads load...</div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="btn-wrap">
          <button class="btn-ghost" id="btnGhost" disabled>
            <span class="countdown-inside" id="countdownNum">10</span>
            Continue to your link →
          </button>
          <button class="btn-active" id="btnActive" onclick="goToLink()">
            ✅ Continue to your link →
          </button>
        </div>
      </div>
    </div>

    <!-- POPUNDER AD -->
    <div style="display:none;">
      <script src="https://pl29794516.effectivecpmnetwork.com/db/6f/ee/db6feee42bca4723e86ee4e801143863.js"></script>
    </div>

    <div class="footer-note">
      🛡️ Safe redirect by AdsEarn App<br>
      Link owner earns coins when you visit!
    </div>
  </div>

  <!-- STICKY BOTTOM AD -->
  <div class="ad-socialbar">
    <script>
      atOptions = {
        'key' : '054b7c1a4cbb13266b09c565eb61513e',
        'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/054b7c1a4cbb13266b09c565eb61513e/invoke.js"></script>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, get, set, update }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCZnYb6pb5JXWpTFy15XRaAyEixZdVXclA",
      authDomain: "this-is-my-first-app-99e55.firebaseapp.com",
      databaseURL: "https://this-is-my-first-app-99e55-default-rtdb.firebaseio.com",
      projectId: "this-is-my-first-app-99e55"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const params   = new URLSearchParams(window.location.search);
    const code     = params.get('code');
    const urlParam = params.get('url');

    let destURL = '';

    // ── Countdown ──
    function startCountdown() {
      const TOTAL = 10;
      let remaining = TOTAL;
      const numEl  = document.getElementById('countdownNum');
      const barEl  = document.getElementById('progressBar');
      const ghost  = document.getElementById('btnGhost');
      const active = document.getElementById('btnActive');

      barEl.style.width = '100%';
      setTimeout(() => {
        barEl.style.transition = `width ${TOTAL}s linear`;
        barEl.style.width = '0%';
      }, 50);

      const timer = setInterval(() => {
        remaining--;
        numEl.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          ghost.style.display  = 'none';
          active.style.display = 'block';
        }
      }, 1000);
    }

    // ── Show content ──
    function showContent(url, showBadge) {
      destURL = url;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('mainContent').style.display  = 'block';
      document.getElementById('destUrl').textContent        = url;
      if (!showBadge) {
        document.getElementById('coinsBadge').style.display = 'none';
      }
      startCountdown();
    }

    // ── CASE 1: code — Link & Earn ──
    if (code) {
      const linkRef = ref(db, 'shortLinks/' + code);
      get(linkRef).then((snap) => {
        if (!snap.exists()) {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').style.display   = 'block';
          return;
        }
        const data = snap.val();

        // Clicks update
        update(linkRef, { clicks: (data.clicks || 0) + 1 });

        // Coins to owner
        const COINS = 2;
        const ownerRef = ref(db, 'users/' + data.userId + '/coins');
        get(ownerRef).then((s) => {
          set(ownerRef, (s.val() || 0) + COINS);
        });

        showContent(data.originalUrl, true);
      }).catch(() => {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display   = 'block';
      });

    // ── CASE 2: url — Promote/Earn ──
    } else if (urlParam) {
      showContent(decodeURIComponent(urlParam), false);

    // ── CASE 3: error ──
    } else {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display   = 'block';
    }

    // ── Continue button ──
    window.goToLink = function() {
      if (destURL) {
        window.location.href = destURL;
      }
    };
  </script>

</body>
</html>
