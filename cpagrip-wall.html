<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdsEarn Tasks</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A1628;
    font-family: sans-serif;
    color: #ffffff;
    min-height: 100%;
  }
  #loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-size: 14px;
    color: #8BA0C0;
    flex-direction: column;
    gap: 12px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a2a4a;
    border-top-color: #FFD700;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #errorMsg {
    display: none;
    padding: 20px;
    text-align: center;
    color: #ff6b6b;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <span>Tasks load ho rahe hain...</span>
</div>
<div id="errorMsg">
  ❌ Tasks load nahi ho paye.<br>
  Internet check karo ya refresh karo.
</div>
<script type="text/javascript">
  function getParam(name) {
    var url = new URL(window.location.href);
    return url.searchParams.get(name);
  }
  var uid = getParam('uid') || 'guest';
  var script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = 'https://getafilenow.com/script_include.php?id=1903031&tracking_id=' + encodeURIComponent(uid);
  script.onload = function() {
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.style.display = 'none';
  };
  script.onerror = function() {
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.style.display = 'none';
    var errEl = document.getElementById('errorMsg');
    if (errEl) errEl.style.display = 'block';
  };
  document.head.appendChild(script);
  setTimeout(function() {
    var loadingEl = document.getElementById('loading');
    if (loadingEl && loadingEl.style.display !== 'none') {
      loadingEl.style.display = 'none';
    }
  }, 8000);
</script>
</body>
</html>
