<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdsEarn Tasks</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A1628;
    font-family: sans-serif;
    color: #ffffff;
    height: 100%;
  }
  #loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-size: 14px;
    color: #8BA0C0;
  }
</style>
</head>
<body>

<div id="loading">Tasks load ho rahe hain...</div>

<script type="text/javascript">
  // URL se ?uid=xxxx nikalo (Flutter WebView se pass hoga)
  function getParam(name) {
    var url = new URL(window.location.href);
    return url.searchParams.get(name);
  }
  var uid = getParam('uid') || 'guest';
  var lck = false;

  // CPAGrip offerwall script ko dynamically load karo user ki UID ke saath
  var script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = 'https://getafilenow.com/script_include.php?id=1903031&tracking_id=' + encodeURIComponent(uid);
  document.head.appendChild(script);
</script>

</body>
</html>
